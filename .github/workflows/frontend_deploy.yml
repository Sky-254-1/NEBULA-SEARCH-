name: Deploy Frontend

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4

    - name: Verify Vercel deployment environment
      env:
        VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      shell: bash
      run: |
        missing=()
        for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
          if [ -z "${!name}" ]; then
            missing+=("$name")
          fi
        done
        if [ "${#missing[@]}" -ne 0 ]; then
          echo "::error title=Missing Vercel credentials::Set ${missing[*]} under Settings -> Secrets and variables -> Actions (or the 'production' environment), then re-run this workflow."
          exit 1
        fi

        npm install --global vercel@latest
        vercel whoami --token="$VERCEL_TOKEN"
        echo "Vercel credentials verified."

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      run: |
        cd frontend
        npm ci

    - name: Run tests
      run: |
        cd frontend
        npm test -- --run

    - name: Run lint
      run: |
        cd frontend
        npm run lint

    - name: Build frontend
      run: |
        cd frontend
        npm run build

    - name: Deploy to Vercel (production)
      env:
        VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      working-directory: ./frontend
      run: |
        vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
        vercel build --prod --token="$VERCEL_TOKEN"
        vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
