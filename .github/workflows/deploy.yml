name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: nebula-backend

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install backend test dependencies
      run: |
        cd backend
        python -m pip install --upgrade pip
        python -m pip install -r requirements-dev.txt

    - name: Run backend tests
      env:
        JWT_SECRET: ci-test-secret
        APP_ENV: testing
        DATABASE_URL: test_nebula.db
      run: |
        cd backend
        python -m pytest tests/ -v --tb=short

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install frontend dependencies
      run: |
        cd frontend
        npm ci

    - name: Run frontend tests
      run: |
        cd frontend
        npm test -- --run

    - name: Run lint
      run: |
        cd frontend
        npm run lint

  security-scan:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      security-events: write
    steps:
    - uses: actions/checkout@v4

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@0.28.0
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy results to GitHub Security
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: 'trivy-results.sarif'

  build-and-push:
    runs-on: ubuntu-latest
    needs: [test, security-scan]
    environment: OpenAI
    permissions:
      id-token: write
      contents: read

    steps:
    - uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/GitHubActionsRole
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build and push Docker image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -f docker/Dockerfile.prod .
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
        docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

    - name: Update Terraform
      working-directory: infra/terraform
      env:
        TF_VAR_aws_account_id: ${{ secrets.AWS_ACCOUNT_ID }}
        TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
        TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}
        TF_VAR_encryption_key: ${{ secrets.ENCRYPTION_KEY }}
        TF_VAR_ssl_certificate_arn: ${{ secrets.SSL_CERTIFICATE_ARN }}
      run: |
        terraform init
        terraform plan -out=tfplan
        terraform apply tfplan

    - name: Deploy to Kubernetes
      env:
        KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
        GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        BING_API_KEY: ${{ secrets.BING_API_KEY }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        AI_PROVIDER: ${{ vars.AI_PROVIDER }}
        GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        GOOGLE_SEARCH_CX: ${{ vars.GOOGLE_SEARCH_CX }}
        OLLAMA_URL: ${{ vars.OLLAMA_URL }}
        OLLAMA_MODEL: ${{ vars.OLLAMA_MODEL }}
        GGUF_MODEL_PATH: ${{ vars.GGUF_MODEL_PATH }}
      run: |
        if [ -z "$OPENAI_API_KEY" ]; then
          echo "::error::Set OPENAI_API_KEY in the OpenAI GitHub Actions environment."
          exit 1
        fi
        umask 077
        secret_env_file="$(mktemp)"
        provider_config_file="$(mktemp)"
        kubeconfig_file="$(mktemp)"
        trap 'rm -f "$secret_env_file" "$provider_config_file" "$kubeconfig_file"' EXIT

        printf '%s' "$KUBE_CONFIG" > "$kubeconfig_file"
        export KUBECONFIG="$kubeconfig_file"

        for name in OPENAI_API_KEY BRAVE_API_KEY GOOGLE_API_KEY SERPAPI_KEY BING_API_KEY GEMINI_API_KEY; do
          value="${!name}"
          if [ -n "$value" ]; then
            printf '%s=%s\n' "$name" "$value" >> "$secret_env_file"
          fi
        done

        printf 'AI_PROVIDER=%s\n' "${AI_PROVIDER:-auto}" >> "$provider_config_file"
        for name in GEMINI_MODEL GOOGLE_SEARCH_CX OLLAMA_URL OLLAMA_MODEL GGUF_MODEL_PATH; do
          value="${!name}"
          if [ -n "$value" ]; then
            printf '%s=%s\n' "$name" "$value" >> "$provider_config_file"
          fi
        done

        kubectl apply -f infra/kubernetes/namespace.yaml
        kubectl apply -f infra/kubernetes/secrets.yaml
        kubectl create secret generic nebula-provider-keys \
          --namespace nebula \
          --from-env-file="$secret_env_file" \
          --dry-run=client -o yaml | kubectl apply -f -
        kubectl create configmap nebula-provider-config \
          --namespace nebula \
          --from-env-file="$provider_config_file" \
          --dry-run=client -o yaml | kubectl apply -f -
        kubectl apply -f infra/kubernetes/deployment.yaml
        kubectl rollout status deployment/nebula-backend -n nebula --timeout=5m
        kubectl delete secret nebula-openai --namespace nebula --ignore-not-found

  notify:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: always()
    steps:
    - name: Notify Slack
      if: always()
      uses: slackapi/slack-github-action@v1.27.0
      with:
        webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
        payload: |
          {
            "text": "Deployment ${{ job.status }}: ${{ github.repository }} @ ${{ github.sha }}"
          }