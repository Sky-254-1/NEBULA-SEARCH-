name: Close Stale Issues and PRs

on:
  schedule:
    - cron: '0 0 * * *'  # Run daily at midnight
  workflow_dispatch:

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/stale@v9
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}
        
        # Issues
        stale-issue-message: 'This issue has been automatically marked as stale due to 30 days of inactivity. It will be closed in 7 days if no further activity occurs. Please comment to keep it open.'
        stale-issue-label: 'stale'
        days-before-issue-stale: 30
        days-before-issue-close: 7
        
        # Pull Requests
        stale-pr-message: 'This pull request has been automatically marked as stale due to 30 days of inactivity. It will be closed in 14 days if no further activity occurs. Please comment to keep it open.'
        stale-pr-label: 'stale'
        days-before-pr-stale: 30
        days-before-pr-close: 14
        
        # Exemptions
        exempt-issue-labels: 'pinned,security,in-progress'
        exempt-pr-labels: 'pinned,security,in-progress'
        
        # Operations
        operations-per-run: 100
        remove-stale-when-updated: true