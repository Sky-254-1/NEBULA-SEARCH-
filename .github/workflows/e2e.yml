name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11']
        node-version: ['20']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install frontend dependencies
      run: |
        cd frontend
        npm ci

    - name: Install Playwright browsers
      run: |
        cd frontend
        npx playwright install --with-deps chromium

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install backend dependencies
      run: |
        cd backend
        pip install -r requirements.txt
        pip install pytest pytest-asyncio httpx

    - name: Start services with Docker Compose
      run: |
        docker compose -f docker-compose.prod.yml up -d postgres redis elasticsearch
        sleep 10
        docker compose -f docker-compose.prod.yml exec -T postgres psql -U nebula -c "CREATE DATABASE test_db;" || true

    - name: Run backend tests
      run: |
        cd backend
        pytest tests/e2e/ -v --tb=short
      env:
        DATABASE_URL: postgresql://nebula:${POSTGRES_PASSWORD}@localhost:5432/nebula
        REDIS_URL: redis://localhost:6379/0

    - name: Run Playwright E2E tests
      run: |
        cd frontend
        npm run test:e2e
      env:
        PLAYWRIGHT_BASE_URL: http://localhost:8000

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: frontend/playwright-report/
        retention-days: 7

    - name: Upload test screenshots
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: playwright-screenshots
        path: frontend/playwright-screenshots/
        retention-days: 7