name: Deploy iOS to App Store

on:
  push:
    tags:
      - 'ios-v*'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.16.0'
        channel: 'stable'

    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '15.0'

    - name: Decode signing certificate
      env:
        CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
        CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
        PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
      run: |
        echo "$CERTIFICATE_BASE64" | base64 -d > certificate.p12
        echo "$PROVISIONING_PROFILE_BASE64" | base64 -d > profile.mobileprovision

        # Create keychain
        security create-keychain -p "" build.keychain
        security default-keychain -s build.keychain
        security unlock-keychain -p "" build.keychain
        security import certificate.p12 -k build.keychain -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
        security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain

        # Install provisioning profile
        mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles/
        cp profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/

    - name: Build iOS IPA
      run: |
        cd mobile
        flutter clean
        flutter pub get
        flutter build ipa --release \
          --export-options-plist=ios/ExportOptions.plist

    - name: Upload to App Store
      uses: apple-actions/upload-testflight-build@v1
      with:
        app-id: ${{ secrets.APP_STORE_APP_ID }}
        username: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
        password: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
        file-path: mobile/build/ios/ipa/*.ipa