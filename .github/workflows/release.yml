name: Create Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.0)'
        required: true
        type: string

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Generate changelog
      id: changelog
      run: |
        # Get the previous tag
        PREVIOUS_TAG=$(git describe --abbrev=0 --tags $(git rev-list --tags --skip=1 --max-count=1) 2>/dev/null || echo "")
        
        if [ -z "$PREVIOUS_TAG" ]; then
          echo "First release - generating full changelog"
          CHANGELOG=$(git log --pretty=format:"- %s (%h)" --reverse)
        else
          CHANGELOG=$(git log ${PREVIOUS_TAG}..HEAD --pretty=format:"- %s (%h)")
        fi
        
        # Escape for JSON
        CHANGELOG_ESCAPED=$(echo "$CHANGELOG" | sed 's/"/\\"/g' | sed ':a;N;$!ba;s/\n/\\n/g')
        
        echo "changelog=$CHANGELOG_ESCAPED" >> $GITHUB_OUTPUT

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref_name }}
        name: Release ${{ github.ref_name }}
        body: |
          ## Changes in this release
          ${{ steps.changelog.outputs.changelog }}
          
          ## Downloads
          - **Android**: Available on Google Play Store (internal track)
          - **iOS**: Available on TestFlight
          - **Desktop**: Check the assets below
          
          ## Installation
          See the [deployment guide](https://github.com/${{ github.repository }}/blob/main/docs/DEPLOYMENT.md) for manual installation.
        draft: false
        prerelease: false
        generate_release_notes: true

    - name: Upload mobile artifacts
      if: startsWith(github.ref, 'refs/tags/mobile-v')
      uses: actions/upload-artifact@v4
      with:
        name: mobile-release-artifacts
        path: |
          mobile/build/app/outputs/bundle/release/app-release.aab
          mobile/build/app/outputs/bundle/release/app-release.aab.metadata
        retention-days: 30

    - name: Upload desktop artifacts
      if: startsWith(github.ref, 'refs/tags/desktop-v')
      uses: actions/upload-artifact@v4
      with:
        name: desktop-release-artifacts
        path: |
          mobile/build/linux/*.deb
          mobile/build/windows/runner/Release/*.exe
          mobile/build/windows/runner/Release/*.msix
          mobile/build/macos/Build/Products/Release/*.app
          mobile/build/macos/Build/Products/Release/*.dmg
        retention-days: 30

  notify:
    runs-on: ubuntu-latest
    needs: create-release
    if: always()
    steps:
    - name: Notify Slack
      uses: slackapi/slack-github-action@v1.27.0
      with:
        webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
        payload: |
          {
            "text": "New release ${{ github.ref_name }} is now available! 🚀\\nhttps://github.com/${{ github.repository }}/releases/latest"
          }