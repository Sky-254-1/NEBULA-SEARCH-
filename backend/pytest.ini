[pytest]
asyncio_mode = auto
testpaths = tests
pythonpath = .
norecursedirs = *.txt *.db .pytest_cache _pytest_cache_workaround
addopts = --ignore=tests/e2e --ignore=tests/load --ignore=../test_ranking_cov.txt --ignore=../test_ranking_output.txt --ignore=../test_ranking_output3.txt --ignore=../test_full.txt --ignore=../test_single.txt --ignore=../test_output.txt --ignore=../test_output2.txt --ignore=../test_output_final.txt --ignore=../router_test.txt --ignore=../router_test_output.txt --ignore=../router_test_result.txt
filterwarnings =
    ignore::DeprecationWarning

[coverage:run]
source = app
omit =
    app/__init__.py
    app/providers/ai/gguf.py

[coverage:report]
fail_under = 85
show_missing = true