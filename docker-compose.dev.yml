services:
  # Development overrides
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
      target: development
    volumes:
      - ./backend/app:/app/app
      - ./backend/vector:/app/vector
      - ./backend/tests:/app/tests
      - ./backend/static:/app/static
      - ./backend/storage:/app/storage
    environment:
      - APP_ENV=development
      - LOG_LEVEL=debug
      - RELOAD=true
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile.dev
      target: development
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/package.json:/app/package.json
      - ./frontend/vite.config.ts:/app/vite.config.ts
    environment:
      - NODE_ENV=development
      - VITE_API_URL=http://localhost:8000
    ports:
      - "3000:3000"
    command: npm run dev -- --host 0.0.0.0 --port 3000

  postgres:
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=nebula
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set a local development POSTGRES_PASSWORD in .env}
      - POSTGRES_DB=nebula

  redis:
    ports:
      - "6379:6379"

  elasticsearch:
    image: elasticsearch:8.11.3
    ports:
      - "9200:9200"
      - "9300:9300"
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m

  # The base file names the MinIO service "storage".
  storage:
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set a local development MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set a local development MINIO_ROOT_PASSWORD in .env}
