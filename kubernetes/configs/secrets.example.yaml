# Example only — do NOT commit filled-in values and do NOT apply this file.
#
# Copy the shape below into your secret manager (External Secrets, Sealed
# Secrets, SOPS) or feed the values to `kubectl create secret generic`.
# Placeholders are intentionally invalid so they cannot be used as-is.
apiVersion: v1
kind: Secret
metadata:
  name: nebula-secrets
  labels:
    app: nebula
type: Opaque
stringData:
  database-url: "postgresql+asyncpg://nebula:<SET_DB_PASSWORD>@postgres:5432/nebula"
  redis-url: "redis://:<SET_REDIS_PASSWORD>@redis:6379/0"
  elasticsearch-url: "http://elasticsearch:9200"
  rabbitmq-url: "amqp://nebula:<SET_RABBITMQ_PASSWORD>@rabbitmq:5672/"
  kafka-bootstrap-servers: "kafka:9092"
  postgres-user: "nebula"
  postgres-password: "<SET_DB_PASSWORD>"
  jwt-secret: "<SET_64_HEX_CHARS>"
  encryption-key: "<SET_BASE64_32_BYTES>"
