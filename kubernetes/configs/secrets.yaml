# Nebula Search — Kubernetes secrets (placeholder manifest)
#
# This file intentionally contains NO credentials. The Secrets are declared
# with empty `data` maps so workloads fail closed (CreateContainerConfigError)
# instead of starting with weak or default credentials.
#
# Provide the real values out-of-band. Pick one:
#
#   1. Imperative:
#        kubectl create secret generic nebula-secrets \
#          --from-literal=database-url="postgresql+asyncpg://nebula:<password>@postgres:5432/nebula" \
#          --from-literal=redis-url="redis://redis:6379/0" \
#          --from-literal=elasticsearch-url="http://elasticsearch:9200" \
#          --from-literal=rabbitmq-url="amqp://nebula:<password>@rabbitmq:5672/" \
#          --from-literal=kafka-bootstrap-servers="kafka:9092" \
#          --from-literal=postgres-user="nebula" \
#          --from-literal=postgres-password="<password>" \
#          --from-literal=jwt-secret="<openssl rand -hex 32>" \
#          --from-literal=encryption-key="<openssl rand -base64 32>"
#
#   2. Declarative (recommended for GitOps): External Secrets Operator,
#      Sealed Secrets, or SOPS. Commit only the encrypted/remote reference,
#      never the plaintext Secret.
#
# Required keys (consumed by kubernetes/deployments/*.yaml):
#   database-url, redis-url, elasticsearch-url, rabbitmq-url,
#   kafka-bootstrap-servers, postgres-user, postgres-password
# Recommended keys (consumed by the backend config when present):
#   jwt-secret (>= 32 chars in production), encryption-key
#
# Do not fill these maps in and commit the result. `secrets.example.yaml`
# documents the expected shape for local experiments only.
#
# The TLS Secret `nebula-ssl-certs` (used by kubernetes/deployments/nginx.yaml)
# is intentionally not declared here: a `kubernetes.io/tls` Secret requires a
# real certificate/key pair. Provision it with cert-manager, or:
#   kubectl create secret tls nebula-ssl-certs --cert=fullchain.pem --key=privkey.pem

apiVersion: v1
kind: Secret
metadata:
  name: nebula-secrets
  labels:
    app: nebula
type: Opaque
data: {}
---
apiVersion: v1
kind: Secret
metadata:
  name: nebula-admin-secrets
  labels:
    app: nebula
type: Opaque
data: {}
